# =============================================================================
# CI — Lint, Format, Test on every push and PR
# =============================================================================
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    needs: fmt
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Install protoc
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-clippy-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-clippy-
      - run: cargo clippy --workspace -- -D warnings

  test:
    name: Test
    runs-on: ubuntu-latest
    needs: fmt
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install protoc
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-test-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-test-
      - run: cargo test --workspace

  # ---------------------------------------------------------------------------
  # Coverage — line coverage report with cargo-llvm-cov
  # ---------------------------------------------------------------------------
  coverage:
    name: Coverage (llvm-cov)
    runs-on: ubuntu-latest
    needs: test
    outputs:
      line_coverage: ${{ steps.coverage_metrics.outputs.line_coverage }}
      uncovered_pct: ${{ steps.coverage_metrics.outputs.uncovered_pct }}
      lines_hit: ${{ steps.coverage_metrics.outputs.lines_hit }}
      lines_found: ${{ steps.coverage_metrics.outputs.lines_found }}
      code_loc: ${{ steps.coverage_metrics.outputs.code_loc }}
      test_loc: ${{ steps.coverage_metrics.outputs.test_loc }}
      test_to_code_pct: ${{ steps.coverage_metrics.outputs.test_to_code_pct }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - name: Install protoc
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-coverage-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-coverage-
      - name: Generate LCOV report
        run: cargo llvm-cov --workspace --lcov --output-path lcov.info
      - name: Compute coverage metrics
        id: coverage_metrics
        shell: bash
        run: |
          # Aggregate line coverage from LCOV
          read -r LH LF <<< "$(awk -F: '
            /^LH:/ {lh += $2}
            /^LF:/ {lf += $2}
            END {print lh+0, lf+0}
          ' lcov.info)"

          LINE_COVERAGE="$(awk -v lh="$LH" -v lf="$LF" 'BEGIN { if (lf==0) print "0.00"; else printf "%.2f", (lh/lf)*100 }')"
          UNCOVERED_PCT="$(awk -v c="$LINE_COVERAGE" 'BEGIN { printf "%.2f", 100-c }')"

          # Approximate source vs tests LOC ratio (non-empty, non-comment lines)
          CODE_LOC="$(find crates -type f -path "*/src/*.rs" ! -path "*/tests/*" -print0 \
            | xargs -0r cat \
            | grep -Ev '^[[:space:]]*(//|$)' \
            | wc -l | tr -d ' ')"

          TEST_LOC="$(find crates -type f \( -path "*/tests/*.rs" -o -path "*/tests/**/*.rs" \) -print0 \
            | xargs -0r cat \
            | grep -Ev '^[[:space:]]*(//|$)' \
            | wc -l | tr -d ' ')"

          TEST_TO_CODE_PCT="$(awk -v t="$TEST_LOC" -v c="$CODE_LOC" 'BEGIN { if (c==0) print "0.00"; else printf "%.2f", (t/c)*100 }')"

          echo "line_coverage=$LINE_COVERAGE" >> "$GITHUB_OUTPUT"
          echo "uncovered_pct=$UNCOVERED_PCT" >> "$GITHUB_OUTPUT"
          echo "lines_hit=$LH" >> "$GITHUB_OUTPUT"
          echo "lines_found=$LF" >> "$GITHUB_OUTPUT"
          echo "code_loc=$CODE_LOC" >> "$GITHUB_OUTPUT"
          echo "test_loc=$TEST_LOC" >> "$GITHUB_OUTPUT"
          echo "test_to_code_pct=$TEST_TO_CODE_PCT" >> "$GITHUB_OUTPUT"
      - name: Generate HTML report
        run: cargo llvm-cov --workspace --html
      - name: Upload coverage to Codecov
        if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
        uses: codecov/codecov-action@v5
        with:
          files: lcov.info
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: true
          verbose: true
      - name: Upload coverage artifacts
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: |
            lcov.info
            target/llvm-cov/html/

  # ---------------------------------------------------------------------------
  # Integration tests — run ignored tests against real Docker Compose services
  # ---------------------------------------------------------------------------
  integration:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install protoc
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-integration-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-integration-

      - name: Start infrastructure services
        run: docker compose up -d clickhouse postgres redis
        env:
          CLICKHOUSE_PORT: "8123"
          CLICKHOUSE_NATIVE_PORT: "9000"
          CLICKHOUSE_DATABASE: llmtrace
          POSTGRES_USER: llmtrace
          POSTGRES_PASSWORD: llmtrace
          POSTGRES_DB: llmtrace
          REDIS_PORT: "6379"

      - name: Wait for services to be ready
        run: |
          echo "Waiting for ClickHouse..."
          for i in $(seq 1 60); do
            if curl -sf http://localhost:8123/ping >/dev/null 2>&1; then
              echo "ClickHouse ready after ${i}s"
              break
            fi
            if [ "$i" -eq 60 ]; then
              echo "ClickHouse failed after 60 attempts"
              docker compose logs clickhouse
              exit 1
            fi
            sleep 2
          done
          echo "Waiting for PostgreSQL..."
          for i in $(seq 1 30); do
            if docker compose exec -T postgres pg_isready -U llmtrace >/dev/null 2>&1; then
              echo "PostgreSQL ready after ${i}s"
              break
            fi
            if [ "$i" -eq 30 ]; then
              echo "PostgreSQL failed after 30 attempts"
              docker compose logs postgres
              exit 1
            fi
            sleep 2
          done
          echo "Waiting for Redis..."
          for i in $(seq 1 30); do
            if docker compose exec -T redis redis-cli ping >/dev/null 2>&1; then
              echo "Redis ready after ${i}s"
              break
            fi
            if [ "$i" -eq 30 ]; then
              echo "Redis failed after 30 attempts"
              docker compose logs redis
              exit 1
            fi
            sleep 2
          done
          echo "All services ready."

      - name: Run integration tests
        env:
          LLMTRACE_CLICKHOUSE_URL: http://localhost:8123
          LLMTRACE_CLICKHOUSE_DATABASE: llmtrace
          LLMTRACE_POSTGRES_URL: postgres://llmtrace:llmtrace@localhost:5432/llmtrace
          LLMTRACE_REDIS_URL: redis://127.0.0.1:6379
        run: cargo test --workspace --features "clickhouse,postgres,redis_backend" -- --ignored

      - name: Stop services
        if: always()
        run: docker compose down -v

  benchmarks:
    name: Benchmarks
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install protoc
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-bench-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-bench-
      - name: Run benchmark regression gate
        run: cargo run --bin benchmarks -- --output-dir benchmarks/results
      - name: Upload benchmark results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: benchmark-results
          path: benchmarks/results/

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [clippy, test, coverage]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install protoc
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-build-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-build-
      - run: cargo build --workspace --release

  # ---------------------------------------------------------------------------
  # Container scan (advisory) — scan Docker image on PRs, don't fail
  # ---------------------------------------------------------------------------
  trivy-scan:
    name: Trivy Container Scan
    runs-on: ubuntu-latest
    needs: build
    permissions:
      security-events: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image for scanning
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: llmtrace-proxy:scan
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@0.31.0
        with:
          image-ref: llmtrace-proxy:scan
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH
          exit-code: "0"

      - name: Upload Trivy SARIF to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: trivy-results.sarif

  summary:
    name: CI Summary
    runs-on: ubuntu-latest
    if: always()
    needs:
      - fmt
      - clippy
      - test
      - coverage
      - integration
      - benchmarks
      - build
      - trivy-scan
    steps:
      - name: Publish human-readable summary
        shell: bash
        env:
          FMT: ${{ needs.fmt.result }}
          CLIPPY: ${{ needs.clippy.result }}
          TEST: ${{ needs.test.result }}
          COVERAGE_JOB: ${{ needs.coverage.result }}
          INTEGRATION: ${{ needs.integration.result }}
          BENCHMARKS: ${{ needs.benchmarks.result }}
          BUILD: ${{ needs.build.result }}
          TRIVY: ${{ needs.trivy-scan.result }}
          LINE_COVERAGE: ${{ needs.coverage.outputs.line_coverage }}
          UNCOVERED_PCT: ${{ needs.coverage.outputs.uncovered_pct }}
          LINES_HIT: ${{ needs.coverage.outputs.lines_hit }}
          LINES_FOUND: ${{ needs.coverage.outputs.lines_found }}
          CODE_LOC: ${{ needs.coverage.outputs.code_loc }}
          TEST_LOC: ${{ needs.coverage.outputs.test_loc }}
          TEST_TO_CODE_PCT: ${{ needs.coverage.outputs.test_to_code_pct }}
        run: |
          status_icon() {
            case "$1" in
              success) echo "PASS" ;;
              failure) echo "FAIL" ;;
              cancelled) echo "CANCELLED" ;;
              skipped) echo "SKIPPED" ;;
              *) echo "${1:-UNKNOWN}" ;;
            esac
          }

          {
            echo "## CI Results"
            echo ""
            echo "| Check | Result |"
            echo "|---|---|"
            echo "| Format | $(status_icon "$FMT") |"
            echo "| Clippy | $(status_icon "$CLIPPY") |"
            echo "| Tests | $(status_icon "$TEST") |"
            echo "| Coverage job | $(status_icon "$COVERAGE_JOB") |"
            echo "| Integration Tests | $(status_icon "$INTEGRATION") |"
            echo "| Benchmarks | $(status_icon "$BENCHMARKS") |"
            echo "| Build | $(status_icon "$BUILD") |"
            echo "| Trivy Scan | $(status_icon "$TRIVY") |"
            echo ""
            echo "## Coverage Metrics"
            echo ""
            echo "| Metric | Value |"
            echo "|---|---|"
            echo "| Codebase covered % | ${LINE_COVERAGE:-N/A}% |"
            echo "| Codebase uncovered % | ${UNCOVERED_PCT:-N/A}% |"
            echo "| Covered lines | ${LINES_HIT:-N/A} |"
            echo "| Total lines instrumented | ${LINES_FOUND:-N/A} |"
            echo "| Source LOC | ${CODE_LOC:-N/A} |"
            echo "| Test LOC | ${TEST_LOC:-N/A} |"
            echo "| Test-to-code LOC % | ${TEST_TO_CODE_PCT:-N/A}% |"
          } >> "$GITHUB_STEP_SUMMARY"
